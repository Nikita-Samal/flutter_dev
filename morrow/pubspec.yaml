name: morrow
description: "Morrow – Maternal and Child Care App. Care for Her. Care for Every Beginning."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase Core
  firebase_core: ^3.15.1

  # Firebase Authentication
  firebase_auth: ^5.6.2

  # Cloud Firestore
  cloud_firestore: ^5.6.9

  # Firebase Storage
  firebase_storage: ^12.4.6

  # Firebase Analytics
  firebase_analytics: ^11.4.6

  # Firebase Crashlytics
  firebase_crashlytics: ^4.3.6

  # Firebase Cloud Messaging
  firebase_messaging: ^15.2.6

  # Google Sign-In (disabled until Firebase configured)
  google_sign_in: ^6.2.2

  # Sign in with Apple (disabled until Firebase configured)
  sign_in_with_apple: ^6.1.4

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  cached_network_image: ^3.4.1

  # State management
  provider: ^6.1.4

  # Utilities
  email_validator: ^3.0.0
  shared_preferences: ^2.3.6
  intl: ^0.20.2
  logger: ^2.5.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
